<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 沿用顶栏那枚太阳标记：海面渐变铺底，日落辉光压在右上（和地图同一套色） -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#17a5a8" />
      <stop offset="0.34" stop-color="#0b6e7f" />
      <stop offset="0.72" stop-color="#083f52" />
      <stop offset="1" stop-color="#221a4d" />
    </linearGradient>
    <radialGradient id="sunset" cx="0.88" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#ffc24b" stop-opacity="0.62" />
      <stop offset="0.55" stop-color="#ff6b35" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ff3d68" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sea)" />
  <rect width="64" height="64" rx="14" fill="url(#sunset)" />
  <circle cx="43" cy="21" r="12.5" fill="#ff7a45" fill-opacity="0.22" />
  <circle cx="43" cy="21" r="7.5" fill="#ff6b35" />
</svg>
